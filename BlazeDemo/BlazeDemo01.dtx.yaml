note: Generated from recorded traffic
steps:
  - open:
      note: Open BlazeDemo
      meta:
        browserName: edge
        browserVersion: 141.0.3537.99
        platformName: windows
      url: '${APP_BLAZEDEMO_URL}'
  - with:
      note: BlazeDemo
      steps:
        - select:
            shot: shot/d6zqtm.dti.jpeg#59
            object: html.select
            identifiers:
              - properties:
                  - label:
                      - val: 'Choose your departure city:'
            value: Boston
        - select:
            shot: shot/xxr6q2.dti.jpeg#85
            object: html.select
            identifiers:
              - properties:
                  - label:
                      - val: 'Choose your destination city:'
            value: Berlin
        - click:
            shot: shot/oxj5yq.dti.jpeg#110
            object: html.inputsubmit
            identifiers:
              - properties:
                  - content:
                      - val: Find Flights
  - with:
      note: BlazeDemo - reserve
